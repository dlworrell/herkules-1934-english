name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install EDT system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-swe

      - name: Install project
        run: python -m pip install -e .

      - name: Run legacy checks
        run: make check

      - name: Check EDT dependency
        run: make edt-check

      - name: Run EDT pilot smoke test
        run: make edt-pilot

      - name: Upload EDT pilot artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herkules-edt-pilot
          path: |
            output/pilot
            reports/pilot
            reports/ocr
            source/swedish/pilot

      - name: Propose EDT pilot outputs as a verified pull request
        # ADR-0006: no direct pushes to main; automation commits must be verified.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_signed_pr.py \
            --branch automation/edt-pilot \
            --title "Update EDT pilot outputs" \
            output/pilot reports/pilot reports/ocr source/swedish/pilot
