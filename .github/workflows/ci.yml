name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install EDT system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-swe

      - name: Install project
        run: python -m pip install -e .

      - name: Run legacy checks
        run: make check

      - name: Check EDT dependency
        run: make edt-check

      - name: Run EDT pilot smoke test
        run: make edt-pilot

      - name: Upload EDT pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: herkules-edt-pilot
          path: |
            output/pilot
            reports/pilot
            reports/ocr
            source/swedish/pilot

      - name: Commit EDT pilot outputs
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pilot reports/pilot reports/ocr source/swedish/pilot
          if git diff --cached --quiet; then
            echo "No EDT pilot output changes to commit."
          else
            git commit -m "Update EDT pilot outputs [skip ci]"
            git push
          fi
