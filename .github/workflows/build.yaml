name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Check sources
        run: make check
      - name: Build all outputs
        run: make all
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: herkules-output
          path: output/
      - name: Propose generated build output as a verified pull request
        # ADR-0006: no direct pushes to main; automation commits must be verified.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_signed_pr.py \
            --branch automation/build-output \
            --title "Update generated build output" \
            output
